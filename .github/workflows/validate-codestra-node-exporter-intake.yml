name: Validate Codestra Node Exporter intake contract

on:
  pull_request:
    paths:
      - 'codestra/intake-monitoring.v1.json'
      - 'scripts/validate_codestra_node_exporter_intake.py'
      - '.github/workflows/validate-codestra-node-exporter-intake.yml'
  push:
    branches: [development, test, staging, production, main]
    paths:
      - 'codestra/intake-monitoring.v1.json'
      - 'scripts/validate_codestra_node_exporter_intake.py'
      - '.github/workflows/validate-codestra-node-exporter-intake.yml'

permissions:
  contents: read

concurrency:
  group: codestra-node-exporter-intake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile and semantically validate intake host-evidence contract
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-node-exporter-intake-pycache
        run: |
          python -m py_compile scripts/validate_codestra_node_exporter_intake.py
          python scripts/validate_codestra_node_exporter_intake.py
