name: Codestra Upstream Source Sync

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - CODESTRA_UPSTREAM.json
      - .github/workflows/upstream-source-sync.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: development
          token: ${{ secrets.CODESTRA_AUTOMATION_TOKEN }}
      - name: Import official upstream source
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          print(data['upstream_clone_url'])
          print(data['upstream_ref'])
          print(data['import_path'])
          PY
          )
          UPSTREAM_URL="${values[0]}"
          UPSTREAM_REF="${values[1]}"
          IMPORT_PATH="${values[2]}"
          [[ "$UPSTREAM_URL" == "https://github.com/prometheus/node_exporter.git" ]]
          [[ "$UPSTREAM_REF" == "master" ]]
          [[ "$IMPORT_PATH" == "upstream" ]]
          rm -rf .codestra-upstream-src "$IMPORT_PATH"
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_URL" .codestra-upstream-src
          UPSTREAM_SHA="$(git -C .codestra-upstream-src rev-parse HEAD)"
          rm -rf .codestra-upstream-src/.git
          mv .codestra-upstream-src "$IMPORT_PATH"
          export UPSTREAM_URL UPSTREAM_REF UPSTREAM_SHA
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          lock={
            'schema_version':'1.0',
            'upstream_clone_url':os.environ['UPSTREAM_URL'],
            'upstream_ref':os.environ['UPSTREAM_REF'],
            'upstream_commit':os.environ['UPSTREAM_SHA'],
            'import_path':'upstream',
            'synchronized_at':datetime.now(timezone.utc).isoformat(),
            'deployment_enabled':False,
            'secret_material_allowed_in_git':False
          }
          Path('CODESTRA_UPSTREAM_LOCK.json').write_text(json.dumps(lock,indent=2)+'\n')
          PY
          git config user.name 'codestra-upstream-sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A upstream CODESTRA_UPSTREAM_LOCK.json
          git diff --cached --quiet && exit 0
          git commit -m "vendor: sync official Node Exporter upstream ${UPSTREAM_SHA}"
          SYNC_BRANCH="automation/upstream-node-exporter-${UPSTREAM_SHA:0:12}"
          git fetch origin "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true
          git push --force-with-lease="refs/heads/${SYNC_BRANCH}" origin "HEAD:refs/heads/${SYNC_BRANCH}"
          existing_pr="$(gh pr list \
            --head "${SYNC_BRANCH}" \
            --base development \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "${existing_pr}" ]]; then
            gh pr create \
              --base development \
              --head "${SYNC_BRANCH}" \
              --title "vendor: review Node Exporter upstream ${UPSTREAM_SHA:0:12}" \
              --body "Automated vendored-source update. Merge only after exact-source CI and review pass; normal promotion remains required."
          fi
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_AUTOMATION_TOKEN }}
