name: Validate Node Exporter repository readiness

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Prove and validate exact source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements-validation.txt
          python3 scripts/validate_codestra_node_exporter.py
          python3 scripts/validate_repository_readiness.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Scan changed source with redacted output
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: Build and verify the exact locked candidate locally
        run: |
          builder="$(jq -r '.buildArgs.GO_BUILDER_IMAGE' codestra/release/image-build.v1.json)"
          runtime="$(jq -r '.buildArgs.NODE_EXPORTER_BASE_IMAGE' codestra/release/image-build.v1.json)"
          dockerfile="$(jq -r '.dockerfile' codestra/release/image-build.v1.json)"
          context="$(jq -r '.context' codestra/release/image-build.v1.json)"
          docker pull "$builder"
          docker pull "$runtime"
          docker build \
            --file "$dockerfile" \
            --build-arg "GO_BUILDER_IMAGE=$builder" \
            --build-arg "NODE_EXPORTER_BASE_IMAGE=$runtime" \
            --tag "local/codestra-node-exporter:${{ github.event.pull_request.head.sha }}" \
            "$context"
          output="$(docker run --rm "local/codestra-node-exporter:${{ github.event.pull_request.head.sha }}" --version 2>&1)"
          grep -F 'version 1.12.1' <<<"$output"
          grep -F 'revision: 6044da783597cc3b57aef7580ddcdcff58a4ee99' <<<"$output"

  validate-merge-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements-validation.txt
          python3 scripts/validate_codestra_node_exporter.py
          python3 scripts/validate_repository_readiness.py
          python3 -m unittest discover -s tests -p 'test_*.py'
